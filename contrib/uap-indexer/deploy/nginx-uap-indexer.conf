# nginx reverse proxy for uap-indexer.
#
# Drop into /etc/nginx/sites-available/ (or conf.d/) and adjust server_name,
# the certificate paths, and the upstream address to match -listen.
#
# The two proxy_set_header lines under "client identity" are load-bearing and
# must stay consistent with the -trustproxy flag: they are what makes the
# indexer's rightmost-entry parse of X-Forwarded-For correct. Details below.

upstream uap_indexer {
    server 127.0.0.1:8961;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name uap.example.com;

    ssl_certificate     /etc/letsencrypt/live/uap.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uap.example.com/privkey.pem;

    # The web wallet is a handful of small static files plus JSON; nothing here
    # justifies a large body. POST /orders caps at 8 KB and POST /broadcast at
    # 200 KB in the indexer itself, so this only saves nginx the read.
    client_max_body_size 256k;

    location / {
        proxy_pass http://uap_indexer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- client identity ---------------------------------------------
        #
        # THESE TWO LINES ARE WHAT MAKE -trustproxy SAFE. Without them nginx
        # forwards the client's own X-Forwarded-For header untouched, and the
        # indexer -- which reads the rightmost entry, on the assumption that a
        # proxy appended it -- would be reading a value the client chose. Every
        # rate limit and abuse control then keys on an attacker-supplied
        # string. Removing these while leaving -trustproxy set is precisely the
        # misconfiguration to avoid.
        #
        # $proxy_add_x_forwarded_for is "whatever the client sent, $remote_addr":
        # it APPENDS the address nginx actually saw. So a request forged as
        #
        #     X-Forwarded-For: 1.1.1.1
        #
        # arrives upstream as
        #
        #     X-Forwarded-For: 1.1.1.1, <real client address>
        #
        # and the indexer takes the last entry. The forged prefix is inert.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        #
        # ONE TRUSTED HOP ONLY. If anything else sits in front of this nginx --
        # a CDN, a load balancer, another proxy -- then the address nginx sees
        # is that intermediary's, and the rightmost entry becomes the CDN's
        # egress IP rather than the user's. In that setup, configure
        # real_ip_module here (set_real_ip_from <cdn ranges>;
        # real_ip_header X-Forwarded-For; real_ip_recursive on;) so $remote_addr
        # is the true client before these lines run. The indexer cannot work
        # this out for itself.

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name uap.example.com;
    return 301 https://$host$request_uri;
}
